name: compilar-black-vr

# Compila o BLACK + modulo de VR no Windows (MSVC 32 bits) e devolve os binarios
# para a branch em dist/, para quem nao tem Visual Studio poder so baixar.
#
# Nao usa nada do jogo: o default.xbe continua sendo do usuario.

on:
  push:
    branches: ["arena/**"]
    paths:
      - "black-vr/src/**"
      - "black-vr/vendor/**"
      - "black-vr/patches/**"
      - "black-vr/entrega/**"
  workflow_dispatch:

# um build por vez; um push novo cancela o anterior
concurrency:
  group: compilar-black-vr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Baixar o port (black-pc 0.3.0) e aplicar o modulo de VR
        shell: bash
        run: |
          set -euxo pipefail
          exec > >(tee -a dist-log.txt) 2>&1
          mkdir -p _fork/black-pc
          cd _fork/black-pc
          git init -q .
          git remote add origin https://github.com/Spark198rus/black-pc.git
          git fetch -q --depth 1 origin b826153997907272dd555b8ec63b6a54fcde0600
          git checkout -q FETCH_HEAD
          cd ../..
          mkdir -p _fork/black-pc/loader/src/vr _fork/black-pc/vendor/openxr
          cp black-vr/src/vr/*.h black-vr/src/vr/*.cpp _fork/black-pc/loader/src/vr/
          cp black-vr/vendor/openxr/*.h _fork/black-pc/vendor/openxr/
          cd _fork/black-pc
          for p in ../../black-vr/patches/*.patch; do
            echo "aplicando $(basename "$p")"
            git apply --whitespace=nowarn "$p"
          done
          echo "OK: emendas aplicadas"

      - name: Compilar o conector OpenXR de 32 bits (openxr_loader.dll)
        id: loader
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo "=== OPENXR LOADER ===" >> dist-log.txt
          curl -sL -o sdk.tgz "https://codeload.github.com/KhronosGroup/OpenXR-SDK/tar.gz/refs/tags/release-1.1.65"
          tar xzf sdk.tgz
          cd OpenXR-SDK-release-1.1.65
          cmake -S . -B build32 -A Win32 -DDYNAMIC_LOADER=ON -DBUILD_API_LAYERS=OFF -DBUILD_TESTS=OFF \
                -DBUILD_CONFORMANCE_TESTS=OFF -DBUILD_SAMPLES=OFF -DBUILD_LOADER=ON >> ../dist-log.txt 2>&1
          cmake --build build32 --config Release --target openxr_loader >> ../dist-log.txt 2>&1
          rc=$?
          echo "loader rc=$rc" >> ../dist-log.txt
          find build32 -name "openxr_loader.dll" >> ../dist-log.txt 2>&1
          exit $rc

      - name: Compilar o conector OpenXR de 64 bits (openxr_loader.dll x64)
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo "=== OPENXR LOADER 64 BITS ===" >> dist-log.txt
          if [ ! -d OpenXR-SDK-release-1.1.65 ]; then
            curl -sL -o sdk.tgz "https://codeload.github.com/KhronosGroup/OpenXR-SDK/tar.gz/refs/tags/release-1.1.65"
            tar xzf sdk.tgz
          fi
          cd OpenXR-SDK-release-1.1.65
          cmake -S . -B build64 -A x64 -DDYNAMIC_LOADER=ON -DBUILD_API_LAYERS=OFF -DBUILD_TESTS=OFF \
                -DBUILD_CONFORMANCE_TESTS=OFF -DBUILD_SAMPLES=OFF -DBUILD_LOADER=ON >> ../dist-log.txt 2>&1
          cmake --build build64 --config Release --target openxr_loader >> ../dist-log.txt 2>&1
          echo "loader64 rc=$?" >> ../dist-log.txt
          find build64 -name "openxr_loader.dll" >> ../dist-log.txt 2>&1
          exit 0

      - name: Configurar (MSVC x86)
        id: config
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo "=== CONFIGURAR ===" >> dist-log.txt
          cmake -S _fork/black-pc/loader -B _fork/black-pc/loader/build -A Win32 -DCMAKE_BUILD_TYPE=Release >> dist-log.txt 2>&1
          rc=$?
          echo "config rc=$rc" >> dist-log.txt
          tail -30 dist-log.txt
          exit $rc

      - name: Compilar
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo "=== COMPILAR ===" >> dist-log.txt
          cmake --build _fork/black-pc/loader/build --config Release --parallel >> dist-log.txt 2>&1
          rc=$?
          echo "build rc=$rc" >> dist-log.txt
          grep -nE "error|Error" dist-log.txt | head -40
          exit $rc

      - name: Sonda do conector (a DLL carrega e responde?)
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo "=== SONDA DO CONECTOR ===" >> dist-log.txt
          L=OpenXR-SDK-release-1.1.65/build32/src/loader/Release/openxr_loader.dll
          [ -f "$L" ] || { echo "sonda: DLL nao foi gerada" >> dist-log.txt; exit 0; }
          mkdir -p probe
          cp "$L" probe/
          cat > probe/probe.c <<'EOF'
          #include <windows.h>
          #include <stdio.h>
          typedef struct XrInstance_T *XrInstance;
          typedef int XrResult;
          typedef XrResult (__stdcall *PFN_gipa)(XrInstance, const char *, void **);
          int main(void) {
              HMODULE m = LoadLibraryA("openxr_loader.dll");
              if (!m) { printf("FALHOU: nao carregou (erro %lu)\n", GetLastError()); return 1; }
              PFN_gipa g = (PFN_gipa)GetProcAddress(m, "xrGetInstanceProcAddr");
              if (!g) { printf("FALHOU: sem xrGetInstanceProcAddr\n"); return 2; }
              void *ci = 0;
              g(0, "xrCreateInstance", &ci);
              if (!ci) { printf("FALHOU: sem xrCreateInstance\n"); return 3; }
              printf("OK: DLL de 32 bits carregou e expoe as funcoes\n");
              return 0;
          }
          EOF
          cat > probe/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(probe C)
          add_executable(probe probe.c)
          EOF
          cmake -S probe -B probe/build -A Win32 >> dist-log.txt 2>&1
          cmake --build probe/build --config Release >> dist-log.txt 2>&1
          EXE=$(find probe/build -name "probe.exe" | head -1)
          if [ -n "$EXE" ]; then
            cp probe/openxr_loader.dll "$(dirname "$EXE")/" 2>/dev/null || true
            ( cd "$(dirname "$EXE")" && ./probe.exe ) > probe-run.txt 2>&1
            echo "sonda: $(cat probe-run.txt)" >> dist-log.txt
          else
            echo "sonda: nao compilou o probe.exe" >> dist-log.txt
          fi
          exit 0

      - name: Compilar a sonda de VR (vr-sonda.exe, 32 bits, programa separado do jogo)
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo "=== SONDA DE VR ===" >> dist-log.txt
          cmake -S black-vr/src/sonda -B sonda-build -A Win32 -DCMAKE_BUILD_TYPE=Release >> dist-log.txt 2>&1
          cmake --build sonda-build --config Release --parallel >> dist-log.txt 2>&1
          rc=$?
          echo "sonda rc=$rc" >> dist-log.txt
          grep -nE "error C|error LNK" dist-log.txt | head -20
          find sonda-build -name "vr-sonda.exe" >> dist-log.txt 2>&1
          exit 0

      - name: Compilar a sonda de VR de 64 bits (vr-sonda64.exe, mesmo codigo)
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo "=== SONDA DE VR 64 BITS ===" >> dist-log.txt
          cmake -S black-vr/src/sonda -B sonda64-build -A x64 -DVR_SONDA_NAME=vr-sonda64 -DCMAKE_BUILD_TYPE=Release >> dist-log.txt 2>&1
          cmake --build sonda64-build --config Release --parallel >> dist-log.txt 2>&1
          echo "sonda64 rc=$?" >> dist-log.txt
          grep -nE "error C|error LNK" dist-log.txt | head -20
          find sonda64-build -name "vr-sonda64.exe" >> dist-log.txt 2>&1
          exit 0

      - name: Empacotar
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          cp dist-log.txt dist/build-log.txt || true
          if [ -f _fork/black-pc/loader/build/Release/black.exe ]; then
            cp _fork/black-pc/loader/build/Release/black.exe dist/
            cp _fork/black-pc/loader/build/Release/blackrt.dll dist/
            # o conector OpenXR de 32 bits vai junto: sem ele nao ha VR, e o Meta/SteamVR nao instalam a versao x86
            L=$(find OpenXR-SDK-release-1.1.65/build32 -name "openxr_loader.dll" -path "*Release*" | head -1)
            if [ -n "$L" ]; then
              cp "$L" dist/openxr_loader.dll
              echo "openxr_loader.dll: $(stat -c%s "$L") bytes" >> dist/build-log.txt
            else
              echo "FALHOU: openxr_loader.dll de 32 bits nao foi gerado" >> dist/build-log.txt
            fi
            S=$(find sonda-build -name "vr-sonda.exe" | head -1)
            if [ -n "$S" ]; then
              cp "$S" dist/vr-sonda.exe
              echo "vr-sonda.exe: $(stat -c%s "$S") bytes" >> dist/build-log.txt
            else
              echo "FALHOU: vr-sonda.exe nao foi gerado" >> dist/build-log.txt
            fi
            mkdir -p dist/x64
            S64=$(find sonda64-build -name "vr-sonda64.exe" | head -1)
            L64=$(find OpenXR-SDK-release-1.1.65/build64 -name "openxr_loader.dll" -path "*Release*" | head -1)
            if [ -n "$S64" ] && [ -n "$L64" ]; then
              cp "$S64" dist/x64/vr-sonda64.exe
              cp "$L64" dist/x64/openxr_loader.dll
              echo "x64: vr-sonda64.exe $(stat -c%s "$S64") bytes, openxr_loader.dll $(stat -c%s "$L64") bytes" >> dist/build-log.txt
            else
              echo "FALHOU: a versao de 64 bits nao foi gerada (S64=$S64 L64=$L64)" >> dist/build-log.txt
            fi
            cp OpenXR-SDK-release-1.1.65/LICENSE dist/OPENXR-LICENSE.txt 2>/dev/null || true
            echo "PRONTO: binarios gerados" >> dist/build-log.txt
          else
            echo "FALHOU: black.exe nao foi gerado" >> dist/build-log.txt
            find _fork/black-pc/loader/build -name "*.exe" -o -name "*.dll" >> dist/build-log.txt 2>/dev/null || true
          fi
          cat > dist/LEIA.txt <<'EOF'
          BLACK VR - programa compilado automaticamente

          Estes dois arquivos sao o programa. Eles NAO incluem o jogo:
          o default.xbe continua sendo o seu.

          Como usar:
            1. Na sua pasta do BLACK (a que tem a pasta game dentro),
               crie uma pasta chamada  port
            2. Copie black.exe e blackrt.dll para dentro dela
            3. Duplo clique em black.exe (ou rode: black.exe --vr)
          EOF
          ls -la dist/

      - name: Guardar como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-vr-binarios
          path: dist/
          if-no-files-found: warn

      - name: Devolver para a branch (para eu poder buscar)
        if: always()
        shell: bash
        run: |
          git config user.name "black-vr builder"
          git config user.email "builder@users.noreply.github.com"
          git add -f dist || true
          if git diff --cached --quiet; then
            echo "nada novo para commitar"
          else
            git commit -q -m "build: binarios compilados no Windows [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
